<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 200" width="300" height="200" font-family="'Segoe UI',Helvetica,Arial,sans-serif">
<title>Bento Goal App</title>
<defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="0.4">
    <stop offset="0" stop-color="#8a74d6"/><stop offset=".5" stop-color="#d79cc4"/><stop offset="1" stop-color="#86b4e0"/>
  </linearGradient><clipPath id="pc"><rect width="300" height="200" rx="16"/></clipPath></defs>
<style>
  .tw{animation:tw 3s ease-in-out infinite alternate}
  @keyframes tw{from{opacity:.15}to{opacity:.95}}
  .cloud{opacity:.22;animation:drift 90s linear infinite}
  @keyframes drift{from{transform:translateX(-80px)}to{transform:translateX(920px)}}
  .bob{animation:bob .9s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-4px)}}</style>
<g clip-path="url(#pc)">
  <rect width="300" height="200" fill="#1d1638"/>
  <rect width="300" height="58" fill="url(#pg)"/>
  <g class="tw" style="animation-duration:3.63s;animation-delay:-3.36s"><rect x="119" y="7" width="2" height="8" fill="#fff"/><rect x="118" y="10" width="8" height="2" fill="#fff"/></g>
  <rect class="tw" style="animation-duration:4.23s;animation-delay:-2.02s" x="149" y="9" width="2" height="2" fill="#fff"/>
  <rect class="tw" style="animation-duration:3.50s;animation-delay:-1.83s" x="149" y="37" width="2" height="2" fill="#fff"/>
  <rect class="tw" style="animation-duration:3.06s;animation-delay:-1.98s" x="106" y="17" width="2" height="2" fill="#fff"/>
  <rect class="tw" style="animation-duration:2.38s;animation-delay:-3.55s" x="116" y="32" width="2" height="2" fill="#fff"/>
  <g class="bob"><rect x="18" y="12" width="5" height="5" fill="#ffd66b"/><rect x="23" y="12" width="5" height="5" fill="#ffd66b"/><rect x="28" y="12" width="5" height="5" fill="#ffd66b"/><rect x="33" y="12" width="5" height="5" fill="#ffd66b"/><rect x="38" y="12" width="5" height="5" fill="#ffd66b"/><rect x="43" y="12" width="5" height="5" fill="#ffd66b"/><rect x="48" y="12" width="5" height="5" fill="#ffd66b"/><rect x="18" y="17" width="5" height="5" fill="#ffd66b"/><rect x="23" y="17" width="5" height="5" fill="#ffd66b"/><rect x="28" y="17" width="5" height="5" fill="#ffd66b"/><rect x="33" y="17" width="5" height="5" fill="#ffd66b"/><rect x="38" y="17" width="5" height="5" fill="#ffd66b"/><rect x="43" y="17" width="5" height="5" fill="#ffd66b"/><rect x="48" y="17" width="5" height="5" fill="#ffd66b"/><rect x="23" y="22" width="5" height="5" fill="#ffd66b"/><rect x="28" y="22" width="5" height="5" fill="#ffd66b"/><rect x="33" y="22" width="5" height="5" fill="#ffd66b"/><rect x="38" y="22" width="5" height="5" fill="#ffd66b"/><rect x="43" y="22" width="5" height="5" fill="#ffd66b"/><rect x="28" y="27" width="5" height="5" fill="#ffd66b"/><rect x="33" y="27" width="5" height="5" fill="#ffd66b"/><rect x="38" y="27" width="5" height="5" fill="#ffd66b"/><rect x="33" y="32" width="5" height="5" fill="#ffd66b"/><rect x="28" y="37" width="5" height="5" fill="#ffd66b"/><rect x="33" y="37" width="5" height="5" fill="#ffd66b"/><rect x="38" y="37" width="5" height="5" fill="#ffd66b"/><rect x="23" y="42" width="5" height="5" fill="#ffffff"/><rect x="28" y="42" width="5" height="5" fill="#ffffff"/><rect x="33" y="42" width="5" height="5" fill="#ffffff"/><rect x="38" y="42" width="5" height="5" fill="#ffffff"/><rect x="43" y="42" width="5" height="5" fill="#ffffff"/></g>
  <text x="284" y="24" text-anchor="end" font-size="9.5" font-weight="700" fill="#ffffff" letter-spacing="1.5" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">TEAM PROJECT</text>
</g>
<text x="18" y="86" font-size="17" font-weight="700" fill="#ffffff">Bento Goal App</text>
<text x="18" y="110" font-size="12.5" fill="#c2b9e3">Take on goals together with friends</text>
<text x="18" y="127" font-size="12.5" fill="#c2b9e3">and grow your avatar along the way.</text>
<rect x="18" y="142" width="60.199999999999996" height="20" rx="10" fill="#ff9cc5" fill-opacity=".16" stroke="#ff9cc5" stroke-opacity=".55"/><text x="25" y="156" font-size="11" font-weight="600" fill="#ff9cc5">Flutter</text><rect x="86.19999999999999" y="142" width="66.8" height="20" rx="10" fill="#ff9cc5" fill-opacity=".16" stroke="#ff9cc5" stroke-opacity=".55"/><text x="93.19999999999999" y="156" font-size="11" font-weight="600" fill="#ff9cc5">Riverpod</text><rect x="161" y="142" width="33.8" height="20" rx="10" fill="#ff9cc5" fill-opacity=".16" stroke="#ff9cc5" stroke-opacity=".55"/><text x="168" y="156" font-size="11" font-weight="600" fill="#ff9cc5">Dio</text>
