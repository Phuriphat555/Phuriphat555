<text x="36" y="56" font-size="26" font-weight="700" fill="#ffffff">Hi, I'm Phuriphat <tspan fill="#ffd66b">✦</tspan></text>
<text x="36" y="84" font-size="13.5" font-weight="700" fill="#c4a8ff">4th-year Software Engineering · Mae Fah Luang University (MFU) · Chiang Rai, Thailand</text>
<text x="36" y="116" font-size="14" fill="#c2b9e3">I like taking an idea all the way through: sketching the screens in Figma,</text>
<text x="36" y="137" font-size="14" fill="#c2b9e3">writing the app, wiring up the API and testing it until it holds together.</text>
<text x="36" y="158" font-size="14" fill="#c2b9e3">Self-motivated and always picking up something new.</text>
<rect x="36" y="172" width="570" height="1" fill="#3a3160"/>
<g><rect x="39" y="186" width="3" height="3" fill="#ffd66b"/><rect x="36" y="189" width="3" height="3" fill="#ffd66b"/><rect x="39" y="189" width="3" height="3" fill="#ffd66b"/><rect x="42" y="189" width="3" height="3" fill="#ffd66b"/><rect x="39" y="192" width="3" height="3" fill="#ffd66b"/><text x="54" y="196" font-size="13.5" font-weight="700" fill="#ffd66b">Studying</text><text x="176" y="196" font-size="13.5" fill="#d9d2f2">Software Engineering at MFU, now in my final year</text></g>
<g><rect x="39" y="213" width="3" height="3" fill="#c4a8ff"/><rect x="36" y="216" width="3" height="3" fill="#c4a8ff"/><rect x="39" y="216" width="3" height="3" fill="#c4a8ff"/><rect x="42" y="216" width="3" height="3" fill="#c4a8ff"/><rect x="39" y="219" width="3" height="3" fill="#c4a8ff"/><text x="54" y="223" font-size="13.5" font-weight="700" fill="#c4a8ff">Web &amp; backend</text><text x="176" y="223" font-size="13.5" fill="#d9d2f2">React, Node.js and NestJS, testing APIs in Postman</text></g>
<g><rect x="39" y="240" width="3" height="3" fill="#ff9cc5"/><rect x="36" y="243" width="3" height="3" fill="#ff9cc5"/><rect x="39" y="243" width="3" height="3" fill="#ff9cc5"/><rect x="42" y="243" width="3" height="3" fill="#ff9cc5"/><rect x="39" y="246" width="3" height="3" fill="#ff9cc5"/><text x="54" y="250" font-size="13.5" font-weight="700" fill="#ff9cc5">Mobile</text><text x="176" y="250" font-size="13.5" fill="#d9d2f2">shipped a React Native app with Expo and a team Flutter app</text></g>
<g><rect x="39" y="267" width="3" height="3" fill="#8fc7ff"/><rect x="36" y="270" width="3" height="3" fill="#8fc7ff"/><rect x="39" y="270" width="3" height="3" fill="#8fc7ff"/><rect x="42" y="270" width="3" height="3" fill="#8fc7ff"/><rect x="39" y="273" width="3" height="3" fill="#8fc7ff"/><text x="54" y="277" font-size="13.5" font-weight="700" fill="#8fc7ff">Games</text><text x="176" y="277" font-size="13.5" fill="#d9d2f2">a Monster Hunter companion app, exploring Unity with C# and C++</text></g>
<g><rect x="39" y="294" width="3" height="3" fill="#9fe3c4"/><rect x="36" y="297" width="3" height="3" fill="#9fe3c4"/><rect x="39" y="297" width="3" height="3" fill="#9fe3c4"/><rect x="42" y="297" width="3" height="3" fill="#9fe3c4"/><rect x="39" y="300" width="3" height="3" fill="#9fe3c4"/><text x="54" y="304" font-size="13.5" font-weight="700" fill="#9fe3c4">Security</text><text x="176" y="304" font-size="13.5" fill="#d9d2f2">secure coding against the OWASP Top 10 in hands-on labs</text></g>
<g><rect x="39" y="321" width="3" height="3" fill="#ffb27a"/><rect x="36" y="324" width="3" height="3" fill="#ffb27a"/><rect x="39" y="324" width="3" height="3" fill="#ffb27a"/><rect x="42" y="324" width="3" height="3" fill="#ffb27a"/><rect x="39" y="327" width="3" height="3" fill="#ffb27a"/><text x="54" y="331" font-size="13.5" font-weight="700" fill="#ffb27a">Right now</text><text x="176" y="331" font-size="13.5" fill="#d9d2f2">sharpening my backend skills and looking for projects</text></g>
<g><rect x="39" y="348" width="3" height="3" fill="#ff9cc5"/><rect x="36" y="351" width="3" height="3" fill="#ff9cc5"/><rect x="39" y="351" width="3" height="3" fill="#ff9cc5"/><rect x="42" y="351" width="3" height="3" fill="#ff9cc5"/><rect x="39" y="354" width="3" height="3" fill="#ff9cc5"/><text x="54" y="358" font-size="13.5" font-weight="700" fill="#ff9cc5">Reach me</text><text x="176" y="358" font-size="13.5" fill="#d9d2f2">qssomme@gmail.com</text></g>
